name: DraBornBuy CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dbb_check:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Verify Expo dependency compatibility
        run: npx expo install --check
      - name: Typecheck and unit tests
        run: npm run check
      - name: Verify Android Metro export (no APK)
        run: npx expo export --platform android --output-dir dist-ci-android
