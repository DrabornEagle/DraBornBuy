name: DraBornBuy v0.2 bootstrap repair

on:
  push:
    branches: [main]
    paths:
      - 'scripts/dbb-v02-bootstrap-fix.mjs'
      - '.github/workflows/dbb-v02-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dbb_repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair local API bootstrap
        run: node scripts/dbb-v02-bootstrap-fix.mjs
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/dbb-api.ts; then
            echo 'No bootstrap changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/dbb-api.ts
          git commit -m 'fix(DraBornBuy): recover from invalid local API placeholders'
          git push origin HEAD:main
