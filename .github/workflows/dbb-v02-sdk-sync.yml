name: DraBornBuy v0.2 Expo 58 sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dbb-v02-sdk-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dbb_sdk_sync:
    runs-on: ubuntu-latest
    env:
      npm_config_legacy_peer_deps: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Upgrade Expo preview and align SDK packages
        run: |
          npm install expo@58.0.0-preview.8 --save-exact
          npx expo install --fix --npm
      - name: Verify dependency alignment
        run: |
          npx expo install --check
          npm run check
      - name: Commit aligned dependencies
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo 'Dependencies already aligned.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'chore(DraBornBuy): align Expo 58 preview.8 packages'
          git push origin HEAD:main
