name: DraBornBuy live UI update

on:
  push:
    branches: [main]
    paths:
      - 'scripts/dbb-live-copy-fix.mjs'
      - '.github/workflows/dbb-apply-live-copy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dbb_apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply live-order copy
        run: node scripts/dbb-live-copy-fix.mjs
      - name: Commit source update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/dbb-app.tsx; then
            echo 'No UI copy changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/dbb-app.tsx
          git commit -m 'fix(DraBornBuy): clarify live pricing and store availability'
          git push origin HEAD:main
